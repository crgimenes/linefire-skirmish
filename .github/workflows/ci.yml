name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  # The real gate: a native pass per OS. Cross-compiling proves a build, never
  # a run, and this repo drives two toolkits that only exist at runtime —
  # Ebitengine for the battle window and glaze (a WebView) for the garage.
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # NO CGO, on any platform, Linux included. Ebitengine is pure Go there on
    # the v2.10 alpha this project pins — which is exactly why it pins that
    # alpha — and glaze reaches every toolkit through purego. Setting this at
    # the job level is the enforcement: a dependency that quietly needed a C
    # toolchain would fail here instead of on somebody's machine.
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # The unit tests build worlds, fold event streams and rasterize the icon
      # without opening anything. The macOS run additionally drives the REAL
      # garage window (a WKWebView, a native click, a native keystroke), which
      # a GitHub macOS runner has a window server for. The live battle tests
      # skip themselves unless SKIRMISH_GAME points at a built game.
      - name: Test
        timeout-minutes: 10
        run: go test -timeout 180s -count 1 ./...

  # Every target the release ships, compile-checked. No cgo anywhere, so one
  # host builds them all — which is why the release is a local script (the
  # shared ./release.sh) and not a workflow with a runner per platform.
  cross-build:
    name: cross-build-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" ./...

  lint:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Lint
        run: $(go env GOPATH)/bin/golangci-lint run ./...
