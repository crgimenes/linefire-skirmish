<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linefire Skirmish — Garage</title>
<link rel="stylesheet" href="/editor.css">
<style>
  /* Linefire's own scheme: near-black field, cyan instruments. Nothing is
     fetched from a network — the garage is a local workshop, and a webview is
     enough of a browser for everything here. */
  :root {
    --bg: #06080c;
    --panel: #0d141c;
    --line: #1e3844;
    --ink: #c8f0ff;
    --dim: #6f97a8;
    --accent: #80ffff;
    --danger: #ff8080;
    --gap: 16px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: clamp(12px, 2vw, 22px);
    background: var(--bg); color: var(--ink);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; flex-direction: column; gap: var(--gap);
    overflow: hidden auto;
  }
  h1 { font-size: clamp(13px, 1.6vw, 16px); letter-spacing: 2px; text-transform: uppercase; margin: 0; }
  h2 { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim);
       margin: 0 0 12px; font-weight: normal; }
  header { display: flex; flex-wrap: wrap; gap: 8px var(--gap);
           justify-content: space-between; align-items: baseline; }
  .sub { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); }

  /* The state light: dim when nothing is flying, alive when a battle is. */
  .state { display: flex; align-items: center; gap: 8px; color: var(--dim); }
  .state::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--dim); transition: background .3s;
  }
  .state.live { color: var(--accent); }
  .state.live::before { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* Two columns while there is room for both; one when the window is narrow.
     The setup column never grows past what its controls need. */
  main { display: grid; gap: var(--gap); align-items: start;
         grid-template-columns: minmax(240px, 280px) minmax(0, 1fr); flex: 1; }
  @media (max-width: 680px) { main { grid-template-columns: minmax(0, 1fr); } }

  section { background: var(--panel); border: 1px solid var(--line); padding: 14px; }
  label { display: block; margin-bottom: 10px; color: var(--dim); }
  /* display:block would otherwise beat the browser's own [hidden] rule, and a
     mode's irrelevant fields would stay on screen. */
  [hidden] { display: none !important; }
  select, input[type=number] {
    width: 100%; margin-top: 3px; padding: 6px;
    background: #060c12; color: var(--ink);
    border: 1px solid var(--line); border-radius: 2px; font: inherit;
  }
  input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--dim); margin-bottom: 12px; }

  button {
    font: inherit; padding: 8px 12px; cursor: pointer; border-radius: 2px;
    background: #12202a; color: var(--ink); border: 1px solid var(--line);
    letter-spacing: .5px; text-transform: uppercase;
    transition: background .15s, border-color .15s, opacity .15s;
  }
  button:hover:not(:disabled) { background: #1e3844; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .35; cursor: default; }
  button.go { border-color: var(--accent); color: var(--accent); }
  /* The row fills the panel and never escapes it: the buttons share the width
     in proportion to their labels and shrink together when the longest state —
     Redeploy — is showing. */
  .actions { display: flex; gap: 8px; margin-top: 4px; }
  .actions button { flex: 1 1 auto; min-width: 0; padding: 8px 4px; }
  /* An order in flight: the row acknowledges the click before the battle can
     possibly answer it. */
  .actions.busy { opacity: .5; pointer-events: none; }

  /* The board. Each fleet is a row of its own colour with a strength bar, so
     who is winning reads before any number does. */
  .fleet {
    display: grid; gap: 4px 12px; padding: 10px 0;
    grid-template-columns: auto minmax(0, 1fr) repeat(5, minmax(42px, auto));
    align-items: center; border-bottom: 1px solid #12202a;
  }
  .fleet:last-child { border-bottom: 0; }
  .heads { color: var(--dim); font-size: 11px; letter-spacing: 1px;
           text-transform: uppercase; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .heads > span:first-child { grid-column: 1 / 3; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; }
  .prog { color: var(--dim); display: flex; align-items: center; gap: 8px; min-width: 0; }
  .prog .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick { padding: 2px 8px; font-size: 11px; text-transform: none; letter-spacing: 0; flex: none; }
  /* A counter snaps to the accent when it moves and fades back on its own. */
  .num { text-align: right; font-variant-numeric: tabular-nums; transition: color .6s; }
  .num.bump { color: var(--accent); transition: none; }
  /* The strength bar spans the row under it: relative fleet size at a glance. */
  .bar { grid-column: 1 / -1; height: 3px; background: #12202a; border-radius: 2px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; transition: width .4s ease-out; }

  .outcome { margin-top: 14px; color: var(--accent); min-height: 1.4em; }
  .outcome:not(:empty) { animation: rise .3s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  .err { margin-top: 10px; color: var(--danger); }
  .err:empty { display: none; }
  .foot { margin-top: 14px; color: var(--dim); font-size: 11px;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* The garage's two rooms: the battle console and the program editor. */
  .tabs { display: flex; gap: 2px; }
  .tabs button {
    background: transparent; color: var(--dim); border: 1px solid transparent;
    border-bottom: none; padding: 6px 14px; font: inherit; cursor: pointer;
    letter-spacing: 1px; text-transform: uppercase; font-size: 11px;
  }
  .tabs button.on { color: var(--accent); border-color: var(--line); background: var(--panel); }

  #view-editor { display: flex; flex-direction: column; flex: 1; min-height: 0;
    align-items: stretch; /* the battle main is a grid with align-items:start — undo it here */ }
  .edwrap { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .edbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .edbar .spacer { flex: 1; }
  .edpath { color: var(--dim); overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; max-width: 40%; }
  .edpath.dirty::after { content: " •"; color: var(--accent); }
  #ed { flex: 1; min-height: 0; }
  /* The editor wears the garage's own palette: theming is CSS variables. */
  #ed.ge {
    --ge-bg: #060c12; --ge-gutter-bg: #0a1118; --ge-border: var(--line);
    --ge-fg: var(--ink); --ge-caret: var(--accent);
    --ge-comp-bg: var(--panel); --ge-err: var(--danger);
  }
  .edout { margin-top: 10px; min-height: 1.5em; color: var(--dim); white-space: pre-wrap; }
  .edout.bad { color: var(--danger); }
  .edout.good { color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Linefire Skirmish</h1>
    <div class="sub">Garage</div>
  </div>
  <nav class="tabs">
    <button id="tab-battle" class="on">Battle</button>
    <button id="tab-editor">Editor</button>
  </nav>
  <div id="state" class="state">no battle</div>
</header>

<main id="view-battle">
  <section>
    <h2>Battle</h2>
    <label>Mode
      <select id="mode">
        <option value="lastfleet">Last fleet standing</option>
        <option value="timed">Timed</option>
        <option value="endless">Endless (aquarium)</option>
      </select>
    </label>
    <label>Battlefield
      <select id="map">
        <option value="arena">Open field</option>
        <option value="maze">Labyrinth</option>
      </select>
    </label>
    <!-- Discrete choices are dropdowns: a faction count and a deadline have a
         handful of sensible values, and a field that cannot be given a
         nonsensical number never has to reject one. -->
    <label>Factions
      <select id="factions">
        <option value="1">1 — solo practice</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8 — the whole palette</option>
      </select>
    </label>
    <label id="shipsLabel">Ships per fleet
      <input id="ships" type="number" min="1" max="60" step="1" value="8">
    </label>
    <label id="durationLabel">Deadline
      <select id="duration">
        <option value="30">30 seconds</option>
        <option value="60">1 minute</option>
        <option value="120" selected>2 minutes</option>
        <option value="300">5 minutes</option>
        <option value="600">10 minutes</option>
      </select>
    </label>
    <div class="check">
      <input id="window" type="checkbox">
      <span>Windowed (not over the desktop)</span>
    </div>
    <div class="check">
      <input id="sound" type="checkbox">
      <span>Sound</span>
    </div>
    <div class="actions" id="actions">
      <button id="deploy" class="go">Deploy</button>
      <button id="restage" disabled>Restage</button>
      <button id="cease" disabled>Cease</button>
    </div>
    <div id="err" class="err"></div>
  </section>

  <section>
    <h2>Fleets</h2>
    <div class="fleet heads">
      <span>Faction</span><span class="num">Alive</span><span class="num">Kills</span>
      <span class="num">Losses</span><span class="num">Shots</span><span class="num">Salvage</span>
    </div>
    <div id="fleets"></div>
    <div id="outcome" class="outcome"></div>
    <div id="foot" class="foot"></div>
  </section>
</main>

<main id="view-editor" hidden>
  <section class="edwrap">
    <div class="edbar">
      <span id="edpath" class="edpath">untitled.filo</span>
      <button id="ednew" class="pick">New</button>
      <button id="edopen" class="pick">Open…</button>
      <button id="edsave" class="pick">Save</button>
      <button id="edsaveas" class="pick">Save as…</button>
      <span class="spacer"></span>
      <button id="edvalidate" class="pick">Validate</button>
      <button id="edtest" class="pick">Quick test</button>
    </div>
    <div id="ed"></div>
    <div id="edout" class="edout"></div>
  </section>
</main>

<script src="/editor.js"></script>
<script>
// The eight bright VGA colours, in the game's own order: colour says WHICH
// FACTION here exactly as it does on the battlefield.
const PALETTE = ["#ff5555", "#55ffff", "#55ff55", "#ff55ff",
                 "#ffff55", "#5555ff", "#ffffff", "#555555"];
const COUNTERS = ["alive", "kills", "losses", "shots", "salvage"];

// programs[i] is faction i+1's .filo file; "" leaves it on the house brain.
const programs = ["", "", "", "", "", "", "", ""];

const $ = (id) => document.getElementById(id);

// A typed number is only advisory until it is clamped: min/max on the element
// stop the spinner, not the keyboard, and an absurd fleet is a battle nobody
// asked for.
function clamped(id) {
  const el = $(id);
  const lo = Number(el.min), hi = Number(el.max);
  let v = Math.round(Number(el.value));
  if (!Number.isFinite(v)) v = lo;
  v = Math.min(Math.max(v, lo), hi);
  if (String(v) !== el.value) el.value = v;
  return v;
}
$("ships").onchange = () => clamped("ships");

function setup() {
  const factions = Number($("factions").value);
  return {
    mode: $("mode").value,
    map: $("map").value,
    factions: factions,
    ships: clamped("ships"),
    duration: Number($("duration").value),
    programs: programs.slice(0, factions),
    window: $("window").checked,
    sound: $("sound").checked,
  };
}

// An order acknowledges itself the moment it is given: the row goes busy at
// once and the board is refreshed as soon as the order lands, instead of
// waiting for the next poll to notice. Launching a battle takes the time it
// takes to start a process — the point is that the click never feels ignored.
let busy = false;
async function guard(fn) {
  if (busy) return;
  busy = true;
  $("actions").classList.add("busy");
  try {
    $("err").textContent = "";
    await fn();
  } catch (e) {
    $("err").textContent = String(e);
  } finally {
    busy = false;
    $("actions").classList.remove("busy");
    poll();
  }
}

$("deploy").onclick = () => guard(() => window.garage_deploy(setup()));
$("restage").onclick = () => guard(() => window.garage_restage());
$("cease").onclick = () => guard(() => window.garage_cease());

// Only the settings a mode actually uses are offered: a deadline means
// nothing to annihilation, and fleet sizes mean nothing to the aquarium.
function syncModeFields() {
  const mode = $("mode").value;
  $("durationLabel").hidden = mode !== "timed";
  $("shipsLabel").hidden = mode === "endless";
}
$("mode").onchange = syncModeFields;
syncModeFields();

// Picking a program is a native file dialog: the garage is a desktop app, so
// it uses the desktop's own chooser. A program is a LAUNCH setting, so the
// battle relaunches with it — the garage never relabels a fleet whose ships
// are still flying the old program.
async function pick(faction) {
  await guard(async () => {
    const path = await window.pickProgram();
    if (!path) return;
    programs[faction - 1] = path;
    paintPrograms();
    const st = await window.garage_status();
    if (st.running) await window.garage_deploy(setup());
  });
}

function fileName(p) {
  const i = Math.max(p.lastIndexOf("/"), p.lastIndexOf("\\"));
  return i < 0 ? p : p.slice(i + 1);
}

// The rows are built once per faction count and then written into. Rebuilding
// them four times a second would flicker and could swallow a click on the very
// button being replaced.
const rows = new Map();

function buildRows(count) {
  if (rows.size === count) return;
  rows.clear();
  $("fleets").textContent = "";
  for (let f = 1; f <= count; f++) {
    const row = document.createElement("div");
    row.className = "fleet";
    row.innerHTML =
      `<span class="swatch" style="background:${PALETTE[(f - 1) % PALETTE.length]}"></span>
       <span class="prog"><span class="name"></span>
         <button class="pick" type="button">choose</button></span>
       <span class="num" data-c="alive">0</span>
       <span class="num" data-c="kills">0</span>
       <span class="num" data-c="losses">0</span>
       <span class="num" data-c="shots">0</span>
       <span class="num" data-c="salvage">0</span>
       <span class="bar"><i style="background:${PALETTE[(f - 1) % PALETTE.length]}"></i></span>`;
    row.querySelector(".pick").onclick = () => pick(f);
    $("fleets").append(row);
    rows.set(f, row);
  }
  paintPrograms();
}

function paintPrograms() {
  for (const [f, row] of rows) {
    const chosen = programs[f - 1];
    row.querySelector(".name").textContent = chosen ? fileName(chosen) : "house brain";
    row.querySelector(".name").title = chosen || "the game's built-in brain";
  }
}

// A counter that just moved lights up for a moment: on a board watched from
// across the room, that is what says the battle is happening.
function writeCounter(cell, value) {
  if (cell.textContent === String(value)) return;
  cell.textContent = value;
  cell.classList.add("bump");
  setTimeout(() => cell.classList.remove("bump"), 80);
}

function paintFleets(fleets) {
  buildRows(fleets.length);
  const strongest = Math.max(1, ...fleets.map((f) => f.alive));
  for (const f of fleets) {
    const row = rows.get(f.faction);
    if (!row) continue;
    for (const c of COUNTERS) {
      writeCounter(row.querySelector(`[data-c=${c}]`), f[c]);
    }
    row.querySelector(".bar > i").style.width = `${(f.alive / strongest) * 100}%`;
  }
}

// The board is polled rather than pushed: the state is small, the window is
// local, and a poll cannot fall behind a battle it is only watching.
async function poll() {
  try {
    const st = await window.garage_status();
    $("state").textContent = st.running
      ? `${st.mode} · ${st.mapName || "…"} · battle ${st.battles}`
      : "no battle";
    $("state").className = st.running ? "state live" : "state";
    $("deploy").textContent = st.running ? "Redeploy" : "Deploy";
    $("restage").disabled = !st.running;
    $("cease").disabled = !st.running;
    paintFleets(st.fleets || []);
    $("outcome").textContent = st.outcome || "";
    $("foot").textContent = st.seed ? `seed ${st.seed} · ${st.gamePath}` : st.gamePath;
    if (st.lastErr) $("err").textContent = st.lastErr;
  } catch (e) {
    // The bridge is not up on the first frames; the next poll will do.
  }
}

// Before the first poll answers, show the fleets the form is configured for.
$("factions").onchange = () => buildRows(Number($("factions").value));
buildRows(2);
setInterval(poll, 120);
poll();

// ---- the editor room ------------------------------------------------------

// The ship contract's vocabulary, for completion. The source of truth is
// linefire's game/pilot.go; this list is the editor's copy of it, and growing
// the contract means growing it here too.
const CONTRACT = [
  "self-x", "self-y", "self-vx", "self-vy", "self-heading", "self-hull",
  "self-hull-max", "self-shield", "self-weapon", "self-kind", "self-faction",
  "self-speed", "self-radar", "self-nav-blocked", "fire-ready", "first-tick",
  "field-w", "field-h", "tick", "allies", "enemies", "loot",
  "move", "seek", "face", "fire",
  "dist", "bearing", "norm-angle", "sin", "cos", "atan2", "sqrt", "abs",
  "mod", "floor", "min", "max", "clamp",
];

const STARTER = `; A fleet program: one copy flies each of your ships.
; Instruments are globals (self-x, enemies, loot...); orders are calls.
; The full contract lives in linefire's game/pilot.go.

(if (is-empty enemies)
    (seek (/ field-w 2) (/ field-h 2))
    (let ((tgt (head enemies)))
      (do
        (face (bearing self-x self-y (nth tgt 1) (nth tgt 2)))
        (fire (nth tgt 1) (nth tgt 2)))))
`;

let ed = null, edPath = "", edDirty = false;

function paintPath() {
  const el = $("edpath");
  el.textContent = edPath || "untitled.filo";
  el.classList.toggle("dirty", edDirty);
}

function edSay(msg, cls) {
  const out = $("edout");
  out.textContent = msg;
  out.className = "edout" + (cls ? " " + cls : "");
}

// The editor is built on first entry: GlazeEditor measures its font from the
// DOM, and a hidden element measures zero.
function initEditor() {
  ed = new GlazeEditor($("ed"), {
    language: "filo",
    completions: CONTRACT,
    value: STARTER,
    onChange: () => {
      edDirty = true;
      paintPath();
      if (ed.errors.size) { ed.clearErrors(); edSay("", ""); }
    },
  });
  ed.focus();
}

function showView(view) {
  $("view-battle").hidden = view !== "battle";
  $("view-editor").hidden = view !== "editor";
  $("tab-battle").classList.toggle("on", view === "battle");
  $("tab-editor").classList.toggle("on", view === "editor");
  if (view === "editor" && !ed) initEditor();
  if (view === "editor") ed.focus();
}
$("tab-battle").onclick = () => showView("battle");
$("tab-editor").onclick = () => showView("editor");

$("ednew").onclick = () => {
  ed.setValue(STARTER);
  edPath = ""; edDirty = false;
  paintPath(); edSay("", "");
};

$("edopen").onclick = async () => {
  try {
    const p = await window.editorPickOpen();
    if (!p) return;
    ed.setValue(await window.editorRead(p));
    edPath = p; edDirty = false;
    paintPath(); edSay("", "");
  } catch (e) { edSay(String(e), "bad"); }
};

async function edSave(as) {
  try {
    let p = edPath;
    if (as || !p) p = await window.editorPickSave();
    if (!p) return;
    await window.editorWrite(p, ed.getValue());
    edPath = p; edDirty = false;
    paintPath(); edSay("saved " + p, "good");
  } catch (e) { edSay(String(e), "bad"); }
}
$("edsave").onclick = () => edSave(false);
$("edsaveas").onclick = () => edSave(true);

$("edvalidate").onclick = async () => {
  try {
    const issue = await window.editorValidate(ed.getValue());
    if (!issue) {
      ed.clearErrors();
      edSay("program OK — compiles and survives its first tick", "good");
      return;
    }
    if (issue.Line > 0) ed.setErrors([{line: issue.Line, msg: issue.Msg}]);
    edSay((issue.Line > 0 ? "line " + issue.Line + ": " : "") + issue.Msg, "bad");
  } catch (e) { edSay(String(e), "bad"); }
};

$("edtest").onclick = async () => {
  $("edtest").disabled = true;
  edSay("fighting 20 battles…", "");
  try {
    edSay(await window.editorQuickTest(ed.getValue()), "good");
  } catch (e) { edSay(String(e), "bad"); }
  $("edtest").disabled = false;
};

// Cmd/Ctrl+S saves from anywhere in the page — the editor is where hands are.
window.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "s") {
    e.preventDefault();
    if (ed && !$("view-editor").hidden) edSave(false);
  }
});
</script>
</body>
</html>
